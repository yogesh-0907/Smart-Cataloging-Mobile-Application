<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Cataloging - AI Product Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .box {
            border: 1px solid #ccc;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>AI Smart Cataloging</h1>

<div class="box">

    <label>Product Image</label>
    <input type="file" id="image" accept="image/*">

    <label>Artisan ID</label>
    <input type="number" id="artisanId" value="1">

    <label>Product Name</label>
    <input type="text" id="productName" placeholder="Example: Bamboo Basket">

    <label>Price</label>
    <input type="number" id="price" placeholder="Example: 1500">

    <button onclick="uploadProduct()">Upload Product</button>

    <div id="result"></div>

</div>

<script>

async function uploadProduct() {

    const image = document.getElementById("image").files[0];
    const artisanId = document.getElementById("artisanId").value;
    const productName = document.getElementById("productName").value;
    const price = document.getElementById("price").value;
    const result = document.getElementById("result");

    if (!image) {
        result.textContent = "Please select an image.";
        return;
    }

    if (!artisanId || !productName || !price) {
        result.textContent = "Please fill all fields.";
        return;
    }

    const formData = new FormData();

    formData.append("image", image);
    formData.append("artisanId", artisanId);
    formData.append("productName", productName);
    formData.append("price", price);

    result.textContent = "Uploading and analyzing image...";

    try {

        const response = await fetch(
            "/api/ai/create-product-from-image",
            {
                method: "POST",
                body: formData
            }
        );

        const text = await response.text();

        if (!response.ok) {
            result.textContent =
                "ERROR " + response.status + "\n\n" + text;
            return;
        }

        let data;

        try {
            data = JSON.parse(text);
            result.textContent =
                "PRODUCT CREATED SUCCESSFULLY!\n\n" +
                JSON.stringify(data, null, 2);
        } catch {
            result.textContent = text;
        }

    } catch (error) {

        result.textContent =
            "Request failed:\n" + error;

    }
}

</script>

</body>
</html>
